[package]
name = "diu-kernel"
version = "0.1.0"
edition = "2021"
description = "DIU OS kernel — the verification invariants of the scientific operating system: canonical digest (RFC 8785 JCS + SHA-256), module manifest contract (D-113), epistemic vocabulary (D-042/D-107), syscall surface (D-123)."
license = "UNLICENSED" # open-sourcing is ADR D-124 (PROPOSED) — a founder decision, not implied by this crate boundary

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_jcs = "0.1"
sha2 = "0.10"
hex = "0.4.3"
